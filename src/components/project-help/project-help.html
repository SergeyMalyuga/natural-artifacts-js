<section class="project-help">
  <div class="project-help__content container">
    <h2 class="project-help__title-main title-section">
      Помочь проекту
    </h2>
    <p class="project-help__text-info text-info">Равным образом, экономическая повестка сегодняшнего дня не даёт нам
      иного выбора, кроме определения прогресса
      профессионального сообщества. Как принято считать, элементы политического процесса рассмотрены исключительно в
      разрезе маркетинговых и финансовых предпосылок. </p>
    <form class="project-help__form">
      <label for="project-help-name" class="project-help__label-name visually-hidden">Имя</label>
      <input id="project-help-name" class="project-help__input project-help__input--name focus" type="text" required placeholder="Имя"/>
      <label for="project-help-email" class="project-help__label-email visually-hidden">Email</label>
      <input id="project-help-email" class="project-help__input project-help__input--email focus" type="email" required placeholder="Email"/>
    <button class="project-help__button-submit button button-focus" type="submit">Отправить</button>
    </form>
  </div>
</section>
